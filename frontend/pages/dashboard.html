<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Dashboard - Laboral</title>
  <script src="../scripts/theme.js?v=20261126d"></script>
  <link rel="stylesheet" href="../styles/base.css?v=20261127c" />
  <link rel="stylesheet" href="../styles/registros.css?v=20260408a" />
  <link rel="stylesheet" href="../styles/refresh.css?v=20261127a" />
  <link rel="stylesheet" href="../styles/theme.css?v=20261126d" />
  <link rel="stylesheet" href="../styles/dashboard.css?v=20261127b" />
</head>
<body data-layout="internal" data-nav-key="dashboard" data-page-title="Dashboard" data-page-subtitle="Consulte as sessões e acompanhe o dia.">
  <main data-layout-content>
    <section class="card dashboard-heading">
      <div><span class="eyebrow" id="dashboardData">Hoje</span><h2>Sessões de hoje</h2><p class="muted-text">Veja o que está pendente, em andamento ou concluído.</p></div>
      <div class="dashboard-refresh"><button id="dashboardAtualizar" class="ghost-btn" type="button">Atualizar</button><span id="dashboardStatus" class="muted-text" role="status" aria-live="polite">Carregando sessões...</span></div>
    </section>
    <section class="dashboard-summary" aria-label="Resumo das sessões de hoje">
      <article class="card"><span>Total de sessões</span><strong id="kpiTotal">—</strong></article>
      <article class="card"><span>Pendentes</span><strong id="kpiPendentes">—</strong></article>
      <article class="card"><span>Em andamento</span><strong id="kpiAndamento">—</strong></article>
      <article class="card"><span>Concluídas</span><strong id="kpiConcluidas">—</strong></article>
    </section>
    <section id="dashboardLista" class="dashboard-list" aria-label="Sessões de hoje" aria-busy="true"><p class="card dashboard-empty">Carregando sessões...</p></section>
  </main>

  <script src="../scripts/auth.js?v=20261126a"></script>
  <script src="../components/internal-layout.js?v=20261126d"></script>
  <script src="../scripts/dashboard.js?v=20261127b"></script>
</body>
</html>
